# Integração contínua: roda a cada push e pull request.
# O deploy é feito pela integração Git do Vercel (dois projetos: backend/ e frontend/).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end e ETL (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Front-end (Vitest e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.exemplo.invalid

  travessao:
    name: Sem travessão nem meia-risca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Procura travessão nos arquivos versionados
        run: |
          encontrados=$(git ls-files -z | LC_ALL=C.UTF-8 xargs -0 grep -nP "\x{2013}|\x{2014}" || true)
          if [ -n "$encontrados" ]; then
            echo "$encontrados"
            echo "::error::Há travessão ou meia-risca nos arquivos acima"
            exit 1
          fi

  integracao:
    name: Consistência no banco real (Supabase)
    # só na principal: lê o banco com a chave secreta guardada nos secrets do GitHub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes de integração
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::notice::SUPABASE_SECRET_KEY não configurada nos secrets; integração pulada"
            exit 0
          fi
          python -m pytest -m integracao
