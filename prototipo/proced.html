<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROCED: Projeção de Consumo por Estrutura Demográfica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
/* ═════════ tokens ═════════ */
:root{
  --paper:#EDF0EF; --panel:#FFFFFF; --panel-2:#F5F7F6;
  --ink:#13201C; --ink-2:#34423D; --muted:#56635E; --faint:#8A9691;
  --rule:#D2DAD7; --rule-2:#E3E8E6; --grid:#E6EBE9;
  --teal:#0E6B5C; --teal-2:#5B9F92; --teal-soft:#D5EAE5;
  --orange:#B5561B; --cobalt:#3656A8;
  --energy:#F2B01E; --energy-soft:#FBEBC4;
  --c3:#8E9A95; --c4:#A7B1AD; --c5:#BCC5C1; --c6:#CDD4D1; --c7:#DCE1DF;
  --hatch:#DDE3E1; --err:#B42318; --err-soft:#FDECEA;
  --shadow:0 14px 34px -14px rgba(19,32,28,.30),0 2px 6px rgba(19,32,28,.07);
  --focus:#0E6B5C;
  --sans:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --r-ctl:8px; --r-pan:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1412; --panel:#141C19; --panel-2:#18211E;
    --ink:#E6EDEA; --ink-2:#C3CEC9; --muted:#98A5A0; --faint:#6C7974;
    --rule:#26322E; --rule-2:#1E2825; --grid:#1D2724;
    --teal:#46B8A4; --teal-2:#2F8375; --teal-soft:#15312B;
    --orange:#E48E52; --cobalt:#869FE8;
    --energy:#F2B01E; --energy-soft:#3A2F12;
    --c3:#6A7772; --c4:#56625E; --c5:#46514D; --c6:#3A4441; --c7:#2F3835;
    --hatch:#1B2421; --err:#F97066; --err-soft:#3A1A17;
    --shadow:0 14px 34px -14px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.35);
    --focus:#46B8A4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1412; --panel:#141C19; --panel-2:#18211E;
  --ink:#E6EDEA; --ink-2:#C3CEC9; --muted:#98A5A0; --faint:#6C7974;
  --rule:#26322E; --rule-2:#1E2825; --grid:#1D2724;
  --teal:#46B8A4; --teal-2:#2F8375; --teal-soft:#15312B;
  --orange:#E48E52; --cobalt:#869FE8;
  --energy:#F2B01E; --energy-soft:#3A2F12;
  --c3:#6A7772; --c4:#56625E; --c5:#46514D; --c6:#3A4441; --c7:#2F3835;
  --hatch:#1B2421; --err:#F97066; --err-soft:#3A1A17;
  --shadow:0 14px 34px -14px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.35);
  --focus:#46B8A4; color-scheme:dark;
}

/* ═════════ base e superfícies do navegador ═════════ */
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
::selection{background:var(--energy-soft);color:var(--ink)}
input,select,textarea{caret-color:var(--teal)}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font-family:inherit;color:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#pe-defs{position:absolute;width:0;height:0;overflow:hidden}

/* ═════════ barra superior ═════════ */
.top{flex:0 0 auto;display:flex;align-items:center;gap:22px;height:58px;padding:0 22px;
  background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand svg{width:24px;height:24px}
.brand b{font-size:16.5px;font-weight:720;letter-spacing:-.01em;font-stretch:92%}
.brand b{letter-spacing:.04em}
.bdesc{font-size:11px;line-height:1.2;color:var(--muted);padding-left:9px;border-left:1px solid var(--rule)}
@media (max-width:1520px){.bdesc{display:none}}
.tabs{display:flex;align-items:stretch;gap:2px;height:100%;flex:1 1 auto;min-width:0}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 13px;border:0;background:none;
  cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;
  transition:color .18s var(--ease)}
.tab svg{width:17px;height:17px;opacity:.75}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);font-weight:650}
.tab[aria-current="page"] svg{opacity:1}
.tab::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;
  background:var(--energy);transform:scaleX(0);transition:transform .24s var(--ease)}
.tab[aria-current="page"]::after{transform:scaleX(1)}
.acts{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.illus{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);
  background:var(--energy-soft);padding:6px 11px;border-radius:100px;white-space:nowrap}
.illus svg{width:13px;height:13px}
.ib{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 11px;border:1px solid transparent;
  border-radius:var(--r-ctl);background:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);
  transition:background .18s var(--ease),transform .12s var(--ease)}
.ib svg{width:16px;height:16px}
.ib:hover{background:var(--panel-2)}
.ib:active{transform:scale(.97)}

/* ═════════ área principal ═════════ */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:18px 22px 104px;
  padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));transition:padding .24s var(--ease)}
main.nodock{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.vh{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.vh h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.022em;line-height:1.15;font-stretch:94%}
.vh p{margin:5px 0 0;font-size:14px;color:var(--ink-2);max-width:92ch;text-wrap:pretty}
.vh p b{font-weight:650;color:var(--ink)}
.rec{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.rec svg{width:14px;height:14px;color:var(--teal)}
.body{flex:1 1 auto;min-height:0;display:grid;gap:16px}
.g-pan{grid-template-columns:minmax(0,1fr) 340px}
.g-dom{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.g-eta{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-sim{grid-template-columns:340px minmax(0,1fr)}

/* painéis: elevação declarada uma vez, só borda */
.pan{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-pan);min-width:0;min-height:0;
  display:flex;flex-direction:column;overflow:hidden}
.ph{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:13px 16px 0}
.ph h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.ph h2 small{font-weight:450;color:var(--muted);font-size:12.5px;margin-left:6px}
.pf{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:9px 16px 12px;font-size:12px;color:var(--muted)}
.plot{position:relative;flex:1 1 auto;min-height:0;margin:8px 8px 0;border-radius:10px;outline-offset:-2px}
.plot>svg{position:absolute;inset:0;width:100%;height:100%}
.pend{display:inline-block;font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--energy-soft);
  padding:1px 7px;border-radius:5px}
.lnk{background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--teal);
  text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* legenda-alternância */
.leg{display:flex;flex-wrap:wrap;gap:6px}
.lt{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--rule);
  border-radius:100px;background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:550;color:var(--ink-2);
  transition:opacity .18s var(--ease),background .18s var(--ease),transform .12s var(--ease)}
.lt:hover{background:var(--panel-2)}
.lt:active{transform:scale(.97)}
.lt[aria-pressed="false"]{opacity:.45}
.lt i{width:18px;height:0;border-top:2.5px solid currentColor}
.lt .band{width:14px;height:10px;border:0;border-radius:2px;background:var(--teal-soft)}

/* ═════════ SVG: cores por classe para seguir o tema ═════════ */
.ax{fill:var(--faint);font-size:11.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.ax-s{fill:var(--faint);font-size:10.5px;font-family:var(--sans)}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--rule);stroke-width:1}
.fut{fill:url(#pe-fut)}
.b60{stroke:var(--faint);stroke-width:1.3}
.b60t{fill:var(--muted);font-size:11.5px;font-weight:650;font-family:var(--sans)}
.band{fill:var(--teal-soft);opacity:.75}
.ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ln.fade{opacity:.28}
.s-mod{stroke:var(--teal)} .s-ibge{stroke:var(--orange);stroke-dasharray:7 5}
.s-alt{stroke:var(--cobalt);stroke-dasharray:1.5 6;stroke-width:2.8}
.t-mod{fill:var(--teal)} .t-ibge{fill:var(--orange)} .t-alt{fill:var(--cobalt)}
.endl{font-size:12.5px;font-weight:650;font-family:var(--sans)}
.endv{fill:var(--muted);font-size:11.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.dot{fill:var(--panel);stroke-width:2.6}
.cur{stroke:var(--ink);stroke-width:1.2}
.curtag{fill:var(--energy)}
.curtx{fill:#1D1603;font-size:12px;font-weight:750;font-family:var(--sans);font-variant-numeric:tabular-nums}
.hov{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.gbase{stop-color:var(--teal);stop-opacity:.16} .gend{stop-color:var(--teal);stop-opacity:0}
.hatch-l{stroke:var(--hatch);stroke-width:3} .hatch-bg{fill:var(--panel-2)}
.hatch2-l{stroke:var(--c4);stroke-width:2.4} .hatch2-bg{fill:var(--panel)}

/* casas do Isotype */
.hs{transition:fill .28s var(--ease),opacity .2s var(--ease)}
.h-u60{fill:var(--teal)} .h-c60{fill:var(--teal-2)} .h-u59{fill:var(--c3)} .h-csf{fill:var(--c4)}
.h-mono{fill:var(--c5)} .h-out{fill:var(--c6)} .h-ccf{fill:var(--c7)}
.hs.dim{opacity:.16}
.hs.hl{opacity:1}
.iso.hovering .hs:not(.hl){opacity:.22}

/* pirâmide */
.p60{fill:var(--teal)} .plo{fill:var(--c5)} .pout{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 2}
.plab{fill:var(--ink-2);font-size:11.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.plab.on{font-weight:700;fill:var(--ink)}
.psex{fill:var(--ink-2);font-size:12px;font-weight:650;font-family:var(--sans)}

/* ═════════ leitura (medidor) ═════════ */
.readout{padding:14px 16px 4px;display:flex;flex-direction:column;gap:2px}
.ro-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.ro-h h2{margin:0;font-size:15px;font-weight:650}
.ro-h .yr{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;background:var(--energy);color:#1D1603;
  padding:1px 8px;border-radius:6px}
.reg{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;padding:11px 0;border-top:1px solid var(--rule-2)}
.reg .lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:550;color:var(--ink-2)}
.reg .lb i{width:18px;height:0;border-top:2.5px solid currentColor;flex:0 0 18px}
.reg .dl{grid-column:1/-1;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.odo{display:inline-flex;align-items:flex-end;font-size:30px;font-weight:720;font-stretch:84%;line-height:1;
  letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.odo .dg{display:inline-block;height:1em;overflow:hidden}
.odo .st{display:block;transition:transform .34s var(--ease)}
.odo .st span{display:block;height:1em;line-height:1em;text-align:center}
.odo .lz{color:transparent}
.odo .sep{display:inline-block;width:.28em;text-align:center}
.odo .u{font-size:12px;font-weight:500;color:var(--muted);margin-left:5px;font-stretch:100%;letter-spacing:0;line-height:1.2}
.odo.off .dg,.odo.off .sep,.odo.off .u{display:none}
.odo.off::before{content:"sem dado";color:var(--faint);font-weight:500;font-size:.5em;font-stretch:100%}
.offmsg{font-size:12.5px;font-weight:600;color:var(--muted)}
.cmp{margin-top:6px;padding-top:4px;border-top:1px solid var(--rule-2)}
.cmp div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px;color:var(--ink-2)}
.cmp b{font-weight:680;color:var(--ink)}
.ctrls{padding:12px 16px 14px;border-top:1px solid var(--rule-2);display:flex;flex-direction:column;gap:13px;margin-top:auto}
.fl label,.fl .flab{display:block;font-size:12px;font-weight:550;color:var(--muted);margin-bottom:6px}
.rangeh{display:flex;justify-content:space-between;align-items:baseline}
.rangeh output{font-size:14px;font-weight:700;color:var(--teal);font-variant-numeric:tabular-nums}
input[type=range].tx{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0;cursor:pointer;accent-color:var(--teal)}
input[type=range].tx::-webkit-slider-runnable-track{height:4px;border-radius:4px;
  background:linear-gradient(90deg,var(--teal) var(--p,34%),var(--rule) var(--p,34%))}
input[type=range].tx::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--panel);border:2.5px solid var(--teal);margin-top:-7px;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .15s var(--ease)}
input[type=range].tx:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range].tx::-moz-range-track{height:4px;border-radius:4px;background:var(--rule)}
input[type=range].tx::-moz-range-progress{height:4px;border-radius:4px;background:var(--teal)}
input[type=range].tx::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--panel);border:2.5px solid var(--teal)}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--panel-2);border:1px solid var(--rule);border-radius:10px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:7px;background:none;cursor:pointer;font-size:12.5px;
  font-weight:550;color:var(--muted);white-space:nowrap;transition:background .18s var(--ease),color .18s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ═════════ domicílios ═════════ */
.iso{position:relative;flex:1 1 auto;min-height:0;margin:10px 16px 0}
.iso>svg{position:absolute;inset:0;width:100%;height:100%}
.isoleg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px 0;font-size:12px;color:var(--ink-2)}
.isoleg span{display:inline-flex;align-items:center;gap:6px}
.isoleg i{width:11px;height:11px;border-radius:2px}
.rows{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 8px 6px;display:flex;flex-direction:column}
.rows .row:not(.hd){flex:1 1 auto;max-height:74px}
.row.tot{cursor:default;border-top:1px solid var(--rule-2);border-radius:0;margin-top:4px;flex:0 0 auto!important}
.row.tot:hover{background:none}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) 64px 76px 118px;align-items:center;gap:10px;
  width:100%;padding:9px 8px;border:0;border-radius:9px;background:none;text-align:left;cursor:default;
  font-size:13px;color:var(--ink-2);transition:background .16s var(--ease)}
.row:hover,.row:focus-visible{background:var(--panel-2)}
.row.hd{font-size:11.5px;font-weight:600;color:var(--muted);padding-top:6px;padding-bottom:6px}
.row.hd:hover{background:none}
.row .sw{width:12px;height:12px;border-radius:3px}
.row .nm{font-weight:550;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;font-weight:450;font-size:11.5px;color:var(--muted)}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.row .v small{font-weight:450;color:var(--muted)}
.hist{width:118px;height:26px}
.hist rect{transition:opacity .2s var(--ease)}
.hist .hb{opacity:.38}
.hist .hb.on{opacity:1}

/* ═════════ etária ═════════ */
.split-v{display:flex;flex-direction:column;min-height:0;gap:0}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--rule-2);white-space:nowrap}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--panel)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.in td{color:var(--ink);font-weight:600}
.tbl tr.in td:first-child{color:var(--teal)}
.tbl tbody tr:last-child td{border-bottom:0}
.twrap{flex:0 1 auto;overflow:auto;margin:0 4px}

/* ═════════ simulador ═════════ */
.form{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.form select,.form input[type=text]{width:100%;height:40px;padding:0 11px;font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-ctl);transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.form select:hover,.form input:hover{border-color:var(--faint)}
.form select:focus,.form input:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.form input.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.help{font-size:11.5px;color:var(--muted);margin-top:5px}
.errm{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:550;color:var(--err);margin-top:5px}
.errm svg{width:13px;height:13px;flex:0 0 13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 15px;border-radius:var(--r-ctl);
  border:1px solid var(--rule);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);
  transition:background .16s var(--ease),transform .12s var(--ease),opacity .16s var(--ease)}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06201B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#06201B}}
.btn.pri:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.bill{margin:16px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--panel)}
.bill-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--rule)}
.bill-h b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.bill-h span{font-size:12px;color:var(--muted)}
.bill-kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--rule-2)}
.bill-kv div{padding:10px 16px;border-right:1px solid var(--rule-2);min-width:0}
.bill-kv div:last-child{border-right:0}
.bill-kv dt{font-size:11.5px;color:var(--muted);margin:0}
.bill-kv dd{margin:2px 0 0;font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-main{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:22px;align-items:end;padding:16px}
.bill-main .odo{font-size:52px}
.bill-main .odo .u{font-size:14px}
.bill-read{font-size:13.5px;color:var(--ink-2);line-height:1.55;max-width:60ch;margin:0}
.bill-hist{position:relative;flex:1 1 auto;min-height:120px;margin:0 16px}
.bill-hist>svg{position:absolute;inset:0;width:100%;height:100%}
.bill-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px 12px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:550;color:var(--ink-2)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.chip.calc i{background:var(--energy)}
.bill-state{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:6px}
.bill-state h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:7px}
.bill-state h3 svg{width:16px;height:16px}
.bill-state p{margin:0;font-size:13px;color:var(--muted);max-width:44ch}
.hb2{fill:var(--c5)} .hb2.last{fill:var(--teal)}
.hlab{fill:var(--faint);font-size:10.5px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.hval{fill:var(--ink-2);font-size:11px;font-weight:600;font-family:var(--sans);font-variant-numeric:tabular-nums}

/* ═════════ estados ═════════ */
.g-est{grid-template-columns:repeat(4,minmax(0,1fr));align-content:stretch}
.fr-b .mini{flex:1 1 auto;min-height:150px;height:auto}
.fr{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-pan);display:flex;flex-direction:column;min-width:0;min-height:max-content}
.fr-h{border-radius:var(--r-pan) var(--r-pan) 0 0}
.st-in{width:100%;height:40px;padding:0 11px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.st-in:focus{outline:0;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.st-in.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.stb,.st4c{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
.okcap{display:flex;align-items:center;gap:6px;color:var(--teal);font-weight:600}
.okcap svg{width:14px;height:14px;flex:0 0 14px}
.fr-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:12.5px;font-weight:650;color:var(--ink-2);background:var(--panel-2)}
.fr-h svg{width:14px;height:14px;flex:0 0 14px}
.fr-h small{margin-left:auto;font-weight:500;color:var(--muted)}
.fr-b{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto}
.fr-ctx{display:flex;flex-wrap:wrap;gap:6px}
.fr-ctx span{font-size:11.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--rule-2);padding:3px 8px;border-radius:100px}
.fr-ctx b{font-weight:650;font-variant-numeric:tabular-nums}
.mini{position:relative;height:150px;border:1px solid var(--rule-2);border-radius:10px;overflow:hidden}
.mini>svg{position:absolute;inset:0;width:100%;height:100%}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:12px;background:color-mix(in srgb,var(--panel) 86%,transparent)}
.ovl h4{margin:0 0 4px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.ovl h4 svg{width:14px;height:14px;flex:0 0 14px}
.ovl p{margin:0;font-size:12px;color:var(--muted);max-width:32ch}
.skel{height:10px;border-radius:4px;background:linear-gradient(90deg,var(--rule-2) 8%,var(--panel-2) 20%,var(--rule-2) 33%);
  background-size:900px 100%;animation:shimmer 1.4s linear 3 forwards;margin-bottom:9px}
@keyframes shimmer{0%{background-position:-450px 0}100%{background-position:450px 0}}
.cap{font-size:11.5px;color:var(--muted);margin:0}
.fr-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--rule-2)}
.fr-f .note{font-size:11.5px;color:var(--muted)}
.est-intro{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);margin:0 0 2px;max-width:100ch}

/* ═════════ estados no contexto ═════════ */
.pskel{position:absolute;inset:0;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.sk-big{flex:1 1 auto;width:100%;height:auto;min-height:60px}
.pstate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:8px;padding:20px}
.pstate h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.pstate h3 svg{width:17px;height:17px;flex:0 0 17px;color:var(--err)}
.pstate p{margin:0 0 4px;font-size:13px;color:var(--muted);max-width:46ch}
.pstate p b{color:var(--ink);font-weight:650}
.pstate.mute p{font-size:12.5px;color:var(--faint)}
.bill-load{flex:1 1 auto;display:flex;flex-direction:column;gap:10px;padding:18px 16px}
.demo{position:relative}
.demopop{position:absolute;right:0;top:calc(100% + 8px);width:310px;max-width:calc(100vw - 24px);background:var(--panel);
  border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:35;animation:fade .16s var(--ease)}
.dp-t{margin:6px 10px 4px;font-size:12px;font-weight:650;color:var(--muted)}
.dp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px;border:0;border-radius:9px;
  background:none;cursor:pointer;text-align:left;transition:background .16s var(--ease)}
.dp-row:hover{background:var(--panel-2)}
.dp-row b{display:block;font-size:13px;font-weight:650;color:var(--ink)}
.dp-row small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.tog{flex:0 0 36px;height:21px;border-radius:21px;background:var(--rule);position:relative;transition:background .18s var(--ease)}
.tog::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:var(--panel);
  box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .2s var(--ease)}
.dp-row[aria-checked="true"] .tog{background:var(--err)}
.dp-row[aria-checked="true"] .tog::after{transform:translateX(15px)}
.ib{position:relative}
.ib.failing{color:var(--err)}
.ib.failing::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--err)}

/* ═════════ linha do tempo flutuante ═════════ */
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(1040px,calc(100% - 32px));display:flex;align-items:center;gap:16px;padding:10px 16px 10px 10px;
  background:var(--panel);border-radius:18px;box-shadow:var(--shadow);z-index:20;

.play{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:0;background:var(--energy);color:#1D1603;cursor:pointer;
  display:grid;place-items:center;transition:transform .12s var(--ease),filter .16s var(--ease)}
.play:hover{filter:brightness(1.05)}

.play svg{width:20px;height:20px}
.dyear{flex:0 0 auto;display:flex;flex-direction:column;line-height:1}
.dyear small{font-size:11px;font-weight:550;color:var(--muted);margin-bottom:3px}
.dyear b{font-size:26px;font-weight:760;font-stretch:84%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tl{position:relative;flex:1 1 auto;min-width:0;height:46px}
.tl-track{position:absolute;left:9px;right:9px;top:13px;height:8px;border-radius:8px;background:var(--rule-2);overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;bottom:0;width:var(--pp,100%);background:var(--energy);border-radius:8px}
.tl-off{position:absolute;top:0;bottom:0;right:0;left:var(--bp);
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px)}
:root[data-theme="dark"] .tl-off{background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 2px,transparent 2px 6px)}
.tl input{position:absolute;left:0;right:0;top:4px;width:100%;height:26px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.tl input::-webkit-slider-runnable-track{height:26px;background:none}
.tl input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;border-radius:6px;background:var(--panel);
  border:2.5px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .12s var(--ease)}
.tl input:active::-webkit-slider-thumb{transform:scaleY(1.08)}
.tl input::-moz-range-track{height:26px;background:none}
.tl input::-moz-range-thumb{width:14px;height:22px;border-radius:6px;background:var(--panel);border:2.5px solid var(--ink)}
.tl-ticks{position:absolute;left:9px;right:9px;top:29px;height:14px}
.tl-ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-ticks span.b{color:var(--ink-2);font-weight:650}
.tl-ticks span.e{transform:translateX(-100%)} .tl-ticks span.s{transform:none}
.dnote{flex:0 0 auto;font-size:12px;color:var(--muted);max-width:18ch;line-height:1.3}

/* ═════════ painéis laterais e aviso ═════════ */
.scrim{position:fixed;inset:0;background:rgba(9,14,12,.46);z-index:40;animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;right:0;height:100%;width:420px;max-width:100%;background:var(--panel);z-index:41;
  display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .3s var(--ease);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--rule)}
.dr-h h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.dr-h h2 svg{width:17px;height:17px;color:var(--teal)}
.dr-b{flex:1 1 auto;overflow:auto;padding:18px 20px}
.dr-f{padding:14px 20px;border-top:1px solid var(--rule)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--rule-2);font-size:13px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:13px;transition:background .16s var(--ease),border-color .16s var(--ease)}
.opt:hover{background:var(--panel-2)}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt input{margin-top:3px;accent-color:var(--teal)}
.opt b{display:block;font-weight:650}
.opt small{color:var(--muted)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.note-box{margin-top:16px;padding:12px 14px;background:var(--panel-2);border-radius:10px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.code{margin:0;padding:14px;border-radius:10px;background:var(--panel-2);border:1px solid var(--rule-2);font-size:12px;line-height:1.55;
  overflow:auto;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink-2);white-space:pre}
.method{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;margin-bottom:10px}
.method em{font-style:normal;font-size:11.5px;font-weight:750;color:#fff;background:var(--teal);padding:2px 7px;border-radius:5px}
:root[data-theme="dark"] .method em{color:#06201B}
.warn{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--energy-soft);font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.warn svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;z-index:50;
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:550;padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);
  transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
main.nodock~.toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}

/* tooltip do gráfico */
.tip{position:absolute;pointer-events:none;z-index:5;min-width:188px;padding:9px 11px;border-radius:10px;background:var(--ink);color:var(--paper);
  font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .14s var(--ease),transform .14s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;margin-bottom:5px}
.tip div{display:flex;align-items:center;gap:8px;padding:1.5px 0}
.tip i{width:12px;height:0;border-top:2.5px solid currentColor;flex:0 0 12px}
.tip span{flex:1;opacity:.82}
.tip em{font-style:normal;font-weight:650;font-variant-numeric:tabular-nums}
.tip small{opacity:.6;font-style:italic}
.tip .hint{margin-top:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--paper) 22%,transparent);opacity:.7;font-size:11px;display:block}

/* ═════════ responsivo ═════════ */
/* telas baixas: painel de leitura compacto e rolável como segurança */
.g-pan>aside.pan{overflow-y:auto}
@media (max-height:840px) and (min-width:761px){
  .odo{font-size:24px}

  .tabs::-webkit-scrollbar{display:none}

  .bill-kv{grid-template-columns:1fr 1fr}
  .bill-kv div:nth-child(2){border-right:0}

  .seg button{height:36px}

  .dock{width:calc(100% - 16px);bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:10px;padding:8px 12px 8px 8px}
  .dyear b{font-size:22px}
  .tl-ticks span.m{display:none}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
/* ════════════════════════════════════════════════════════════════════════
   PROCED, Projeção de Consumo por Estrutura Demográfica: protótipo de alta fidelidade.
   Estados de exceção aparecem no contexto de cada tela; o menu Demonstração
   simula a falha da API para apresentar a recuperação
   Todos os valores exibidos são ILUSTRATIVOS, produzidos por funções
   sintéticas para demonstrar o comportamento da interface. Não decorrem
   de apuração da POF, do IBGE ou de qualquer outra base.
   ════════════════════════════════════════════════════════════════════════ */
'use strict';
const Y0=2026,Y1=2075,IBGE_END=2060;
const q=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(a,v,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n1=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const n0=v=>Math.round(v).toLocaleString('pt-BR');
const sg=v=>(v>=0?'+':'−')+n1(Math.abs(v));

/* ---------- ícones autorais, traço único de 1,6 ---------- */
const I=(d)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICO={

const shape=(y,k=7.2)=>{const t=(y-Y0)/(Y1-Y0),s=x=>1/(1+Math.exp(-k*(x-.5)));return (s(t)-s(0))/(s(1)-s(0))};

function sv(id,y,taxa=S.taxa,rec=S.rec){
  const g=taxa/1.7, rf=rec==='60'?1:.8, s=shape(y);
  if(id==='mod')return (158.4+71.9*s*g)*rf;
  if(id==='ibge')return y<=IBGE_END?(157.9+50.2*s)*rf:null;   /* oficial não depende da taxa do usuário */
  return (159.2+103.1*s*g)*rf;
}

const share=(a,y)=>a.s26+(a.s75-a.s26)*shape(y);
const kwh=(a,y)=>a.kw*(1+a.gr*shape(y));
function houseCounts(y){                                  /* maior resto: soma exatamente 100 */
  const raw=ARR.map(a=>share(a,y)), fl=raw.map(Math.floor);
  let left=100-fl.reduce((s,v)=>s+v,0);
  raw.map((v,i)=>({i,r:v-fl[i]})).sort((a,b)=>b.r-a.r).slice(0,left).forEach(o=>fl[o.i]++);
  return fl;
}

function pyrAt(y){
  let i=0; while(i<PK.length-2&&y>PK[i+1].y)i++;

function setOdo(el,v){
  if(!el)return;

  if(!odo)return;
  if(v==null){odo.classList.add('off');return}
  odo.classList.remove('off');
  const t=Math.round(clamp(0,v,999.9)*10), ds=[Math.floor(t/1000)%10,Math.floor(t/100)%10,Math.floor(t/10)%10,t%10];
  const cols=odo.querySelectorAll('.dg');
  cols.forEach((c,i)=>{
    c.firstChild.style.transform='translateY('+(-ds[i])+'em)';

/* ---------- utilidades de gráfico ---------- */
function box(el){const r=el.getBoundingClientRect();return {W:Math.max(240,Math.floor(r.width)),H:Math.max(150,Math.floor(r.height))}}
const path=(pts,X,Y)=>pts.map((p,i)=>(i?'L':'M')+X(p.y).toFixed(1)+','+Y(p.v).toFixed(1)).join('');
function ticks(lo,hi,n){const raw=(hi-lo)/Math.max(1,n),steps=[5,10,20,25,40,50,100];let st=steps.find(x=>x>=raw)||100;
  const o=[];for(let v=Math.ceil(lo/st)*st;v<=hi+1e-6;v+=st)o.push(v);return o}

const P={};
function rangeFor(){
  let lo=1e9,hi=-1e9;
  for(let y=Y0;y<=Y1;y++)SER.forEach(s=>{if(!S.show[s.id])return;const v=sv(s.id,y);if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}});
  if(lo>hi){lo=120;hi=280}
  lo=Math.floor((lo-6)/20)*20; hi=Math.ceil((hi+6)/20)*20;
  return [lo,hi];
}
function drawPan(){
  const el=q('panPlot'); if(!el||S.fail||!S.loaded.pan)return;
  const {W,H}=box(el), mob=W<560;
  const m={t:30,r:mob?14:140,b:30,l:44};
  const iw=W-m.l-m.r, ih=H-m.t-m.b, [lo,hi]=rangeFor();
  const X=y=>m.l+(y-Y0)/(Y1-Y0)*iw, Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  Object.assign(P,{X,Y,m,iw,ih,W,H,lo,hi});
  let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Consumo residencial per capita projetado, 2026 a 2075">';
  g+='<rect class="fut" x="'+X(IBGE_END)+'" y="'+m.t+'" width="'+(m.l+iw-X(IBGE_END))+'" height="'+ih+'"/>';
  ticks(lo,hi,mob?4:5).forEach(v=>{g+='<line class="gl" x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+Math.round(v)+'</text>'});
  (mob?[2026,2050,2075]:[2026,2035,2045,2055,2060,2065,2075]).forEach(y=>{
    g+='<text class="ax" x="'+X(y)+'" y="'+(H-9)+'" text-anchor="'+(y===Y0?'start':y===Y1?'end':'middle')+'">'+y+'</text>'});
  g+='<line class="bl" x1="'+m.l+'" x2="'+(m.l+iw)+'" y1="'+(m.t+ih)+'" y2="'+(m.t+ih)+'"/>';
  g+='<line class="b60" x1="'+X(IBGE_END)+'" x2="'+X(IBGE_END)+'" y1="'+(m.t-6)+'" y2="'+(m.t+ih)+'"/>';
  g+=mob?'<text class="b60t" x="'+(X(IBGE_END)+5)+'" y="'+(m.t+12)+'">sem oficial</text>'
        :'<text class="b60t" x="'+(X(IBGE_END)+8)+'" y="'+(m.t+13)+'">Sem projeção oficial após 2060</text>';
  /* faixa de incerteza: envelope dos cenários visíveis */
  const top=[],bot=[];
  for(let y=Y0;y<=Y1;y++){const vs=SER.filter(s=>S.show[s.id]).map(s=>sv(s.id,y)).filter(v=>v!=null);
    if(vs.length>1){top.push({y,v:Math.max(...vs)});bot.push({y,v:Math.min(...vs)})}}
  if(top.length>1)g+='<path class="band" d="'+path(top,X,Y)+'L'+bot.slice().reverse().map(p=>X(p.y).toFixed(1)+','+Y(p.v).toFixed(1)).join('L')+'Z"/>';
  const pts={};
  SER.forEach(s=>{const a=[];for(let y=Y0;y<=Y1;y++){const v=sv(s.id,y);if(v!=null)a.push({y,v})}pts[s.id]=a});
  P.pts=pts;
  /* passado sólido, futuro esmaecido: a posição no tempo fica visível */
  SER.forEach(s=>{if(S.show[s.id])g+='<path class="ln fade s-'+s.cls+'" d="'+path(pts[s.id],X,Y)+'"/>'});
  g+='<clipPath id="pe-past"><rect id="panClip" x="'+(m.l-4)+'" y="0" width="'+(X(S.year)-m.l+4)+'" height="'+H+'"/></clipPath><g clip-path="url(#pe-past)">';
  SER.forEach(s=>{if(S.show[s.id])g+='<path class="ln s-'+s.cls+'" d="'+path(pts[s.id],X,Y)+'"/>'});
  g+='</g>';
  if(!mob)SER.forEach(s=>{if(!S.show[s.id])return;const L=pts[s.id][pts[s.id].length-1];
    g+='<text class="endl t-'+s.cls+'" x="'+(X(L.y)+9)+'" y="'+(Y(L.v)+4)+'">'+s.short+'</text><text class="endv" x="'+(X(L.y)+9)+'" y="'+(Y(L.v)+18)+'">'+n1(L.v)+' em '+L.y+'</text>'});
  g+='<g id="panCur"><line class="cur" y1="'+(m.t-2)+'" y2="'+(m.t+ih)+'"/><rect class="curtag" x="-22" y="'+(m.t-24)+'" width="44" height="19" rx="5"/><text class="curtx" y="'+(m.t-10)+'" text-anchor="middle"></text>';
  SER.forEach(s=>{if(S.show[s.id])g+='<circle class="dot s-'+s.cls+'" data-s="'+s.id+'" r="4.6" style="stroke-dasharray:none"/>'});
  g+='</g><line class="hov" id="panHov" y1="'+m.t+'" y2="'+(m.t+ih)+'" opacity="0"/>';
  g+='<rect id="panHit" x="'+m.l+'" y="'+m.t+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:pointer;touch-action:none"/></svg><div class="tip" id="panTip"></div>';
  el.innerHTML=g;
  wirePanHit(); updPan();

function updPan(){

}
function wirePanHit(){
  const hit=q('panHit'),tip=q('panTip'),hov=q('panHov'),el=q('panPlot'); if(!hit)return;
  let drag=false;
  const yAt=ev=>{const r=el.querySelector('svg').getBoundingClientRect();return clamp(Y0,Math.round(Y0+((ev.clientX-r.left)*(P.W/r.width)-P.m.l)/P.iw*(Y1-Y0)),Y1)};
  const show=ev=>{
    const y=yAt(ev); hov.setAttribute('x1',P.X(y));hov.setAttribute('x2',P.X(y));hov.setAttribute('opacity','1');
    let h='<b>'+y+'</b>';
    SER.forEach(s=>{if(!S.show[s.id])return;const v=sv(s.id,y);
      h+='<div style="color:var(--'+(s.id==='mod'?'teal':s.id==='ibge'?'orange':'cobalt')+')"><i></i><span style="color:var(--paper)">'+s.short+'</span>'+(v==null?'<small>sem oficial</small>':'<em style="color:var(--paper)">'+n1(v)+'</em>')+'</div>'});
    h+='<span class="hint">Clique ou arraste para levar a linha do tempo até aqui</span>';
    tip.innerHTML=h; tip.classList.add('on');
    const r=el.getBoundingClientRect(), lx=P.X(y)/P.W*r.width, fl=lx>r.width-220;
    tip.style.left=(fl?Math.max(4,lx-206):lx+14)+'px';
    tip.style.top=clamp(8,ev.clientY-r.top-60,Math.max(8,r.height-150))+'px';
    if(drag)setYear(y,true);
  };
  hit.addEventListener('pointermove',show);
  hit.addEventListener('pointerdown',ev=>{drag=true;stopPlay();hit.setPointerCapture(ev.pointerId);show(ev);setYear(yAt(ev),true)});
  hit.addEventListener('pointerup',()=>{drag=false;announce()});
  hit.addEventListener('pointerleave',()=>{if(!drag){tip.classList.remove('on');hov.setAttribute('opacity','0')}});
}

    body.innerHTML='<div class="bill-main"><div id="billOdo">'+odoHTML('kWh/mês por pessoa')+'</div><p class="bill-read" id="billRead"></p></div>'+
      '<div class="bill-hist" id="billHist"></div>'+
      '<div class="bill-f"><span class="chip" id="billChip"><i></i><span></span></span><span>Fonte: <span class="pend">a definir</span></span><button type="button" class="btn" data-open="exportar">'+ICO.down+'Exportar resultado</button></div>';
    setOdo(q('billOdo'),simPrev!=null?simPrev:v);
    requestAnimationFrame(()=>requestAnimationFrame(()=>setOdo(q('billOdo'),v)));
  } else setOdo(q('billOdo'),v);
  q('billRead').innerHTML='Em <b>'+ano+'</b>, um domicílio do tipo <b>'+esc(a.k.toLowerCase())+'</b> com chefe na faixa de <b>'+esc(fai)+'</b> consumiria <b>'+n1(v)+' kWh por mês por pessoa</b>, '+sg((v/v0-1)*100)+'% em relação a 2026, com taxa de envelhecimento de '+n1(taxa)+'% ao ano.';
  const chip=q('billChip'); chip.classList.toggle('calc',!cached||fresh);
  chip.querySelector('span').textContent=(!cached||fresh)?'Calculado agora e salvo para as próximas consultas':'Recuperado de cenário já calculado';
  simPrev=v; drawBillHist(val,ano); bindOpeners();
}
function simLoad(){
  const b=q('billBody'); if(!b)return; ltClear();
  b.innerHTML='<div class="bill-load" aria-busy="true"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div><div class="skel sk-big"></div></div>';
  LT.push(setTimeout(()=>{if(S.view==='sim')simRender(true)},600));
}
function drawBillHist(val,ano){
  const el=q('billHist'); if(!el)return;
  const {W,H}=box(el), ys=[]; for(let y=Y0;y<ano;y+=5)ys.push(y); ys.push(ano);
  const m={t:18,b:20}, n=ys.length, gp=Math.max(6,W*.018), bw=Math.min(46,(W-gp*(n-1))/n), ox=(W-(bw*n+gp*(n-1)))/2;
  const mx=Math.max(...ys.map(val))*1.05;
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Histórico projetado de 2026 até '+ano+'">'+
    '<line class="bl" x1="0" x2="'+W+'" y1="'+(H-m.b)+'" y2="'+(H-m.b)+'"/>'+
    ys.map((y,i)=>{const h=Math.max(2,val(y)/mx*(H-m.t-m.b)), x=ox+i*(bw+gp), last=i===n-1;
      return '<rect class="hb2'+(last?' last':'')+'" x="'+x.toFixed(1)+'" y="'+(H-m.b-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>'+
        '<text class="hlab" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+y+'</text>'+
        (last||i===0?'<text class="hval" x="'+(x+bw/2).toFixed(1)+'" y="'+(H-m.b-h-5).toFixed(1)+'" text-anchor="middle">'+n1(val(y))+'</text>':'')}).join('')+'</svg>';
}
function bindSim(){
  const f=q('simForm');
  f.onsubmit=e=>{e.preventDefault();if(q('fGo').disabled)return;if(S.fail){simRender(false);return}simLoad()};
  ['fAno','fFai','fArr','fBase'].forEach(id=>q(id).onchange=()=>simRender(false));
  q('fTaxa').oninput=()=>simRender(false);
  q('fReset').onclick=()=>{q('fAno').value='2075';q('fFai').value='70 a 79';q('fArr').value='u60';q('fBase').value='mod';q('fTaxa').value='1,7';simRender(false)};
  simPrev=null; simRender(false);
}

/* ═════════ ESTADOS NO CONTEXTO: carregamento e falha de conexão ═════════ */
S.fail=false; S.loaded={pan:false,dom:false,eta:false};
let LT=[]; const ltClear=()=>{LT.forEach(clearTimeout);LT=[]};
const SENT={pan:'panSent',dom:'domSent',eta:'etaSent'};
const SKELP='<div class="pskel" aria-hidden="true"><div class="skel" style="width:32%"></div><div class="skel sk-big"></div><div class="skel" style="width:58%;margin-bottom:0"></div></div>';
const failHTML=()=>'<div class="pstate" role="alert"><h3>'+ICO.alert+'Não foi possível carregar a projeção</h3>'+
  '<p>Verifique a conexão e tente novamente. Os parâmetros foram mantidos: ano <b>'+Math.round(S.year)+'</b>, taxa <b>'+n1(S.taxa)+'%</b>.</p>'+
  '<button class="btn" data-retry>'+ICO.refresh+'Tentar novamente</button></div>';
function loadView(v){
  const V=VIEWS[v]; if(!V||!V.plots)return;
  ltClear();
  if(S.fail){showFail(v);return}
  if(!S.loaded[v]){
    D.houses=null;
    V.plots.forEach(id=>{const e=q(id);if(e){e.innerHTML=SKELP;e.setAttribute('aria-busy','true')}});
    const t=q(SENT[v]); if(t)t.textContent='Carregando dados…';
    LT.push(setTimeout(()=>{if(S.view!==v||S.fail)return;S.loaded[v]=true;finishView(v)},750));
    return;
  }
  finishView(v);
}
function finishView(v){
  const V=VIEWS[v];
  V.plots.forEach(id=>{const e=q(id);if(e)e.removeAttribute('aria-busy')});
  V.draw();
  if(S.intro&&V.dock)intro(); else setYear(S.year);
}
function showFail(v){
  ltClear(); stopPlay(); D.houses=null;
  const V=VIEWS[v]; if(!V||!V.plots)return;
  V.plots.forEach((id,i)=>{const e=q(id);if(!e)return;e.removeAttribute('aria-busy');
    e.innerHTML=i===0?failHTML():'<div class="pstate mute"><p>Aguardando dados</p></div>'});
  const t=q(SENT[v]); if(t)t.textContent='Dados indisponíveis no momento. Os controles continuam ativos e serão aplicados quando a conexão voltar.';
  if(v==='pan')SER.forEach(s=>{const r=q('reg-'+s.id);if(r){setOdo(r,null);r.querySelector('.dl').textContent='Sem dados carregados'}});
  if(v==='pan'){['cmpAmp','cmpGap','cmpPop'].forEach(id=>{const e=q(id);if(e)e.textContent='sem dado'})}
  bindRetry();
}
function bindRetry(){document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=retry)}
function retry(){
  S.fail=false; syncDemo();
  if(S.view==='sim'){simLoad();LT.push(setTimeout(()=>toast('Conexão restabelecida'),620));return}
  S.loaded[S.view]=false; loadView(S.view);
  LT.push(setTimeout(()=>toast('Conexão restabelecida'),780));
}
/* menu de demonstração: aciona a falha simulada da API para apresentar a recuperação */
function syncDemo(){
  const sw=q('swFail'); if(sw)sw.setAttribute('aria-checked',String(S.fail));
  const b=q('demoBtn'); if(b)b.classList.toggle('failing',S.fail);
}
function toggleDemo(open){
  const pop=q('demoPop'),b=q('demoBtn'); const o=open!=null?open:pop.hidden;
  pop.hidden=!o; b.setAttribute('aria-expanded',String(o));
}
function bindDemo(){
  q('demoBtn').onclick=e=>{e.stopPropagation();toggleDemo()};
  q('demoPop').onclick=e=>e.stopPropagation();
  document.addEventListener('click',()=>{if(!q('demoPop').hidden)toggleDemo(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('demoPop').hidden){toggleDemo(false);q('demoBtn').focus()}});
  q('swFail').onclick=()=>{
    S.fail=!S.fail; syncDemo();
    if(S.view==='sim')simRender(false);
    else if(S.fail)showFail(S.view);
    else{S.loaded[S.view]=false;loadView(S.view)}
    toast(S.fail?'Falha de conexão simulada':'Conexão restabelecida');
  };
  q('replayLoad').onclick=()=>{
    toggleDemo(false);
    if(S.fail){toast('Desligue a falha simulada para rever o carregamento');return}
    if(S.view==='sim'){simLoad();return}
    S.loaded[S.view]=false; loadView(S.view);
  };
}

/* ═════════ LINHA DO TEMPO ═════════ */
function buildDock(){
  const bp=((IBGE_END-Y0)/(Y1-Y0)*100).toFixed(2);
  const tk=[[2026,'s'],[2035,'m'],[2045,'m'],[2060,'b'],[2075,'e']];
  q('dock').innerHTML='<button class="play" id="play" aria-label="Reproduzir os 50 anos">'+ICO.play+'</button>'+
    '<div class="dyear"><small>Ano</small><b class="num" id="dYear">'+Math.round(S.year)+'</b></div>'+
    '<div class="tl"><div class="tl-track"><div class="tl-fill" id="tlFill"></div><div class="tl-off" style="--bp:'+bp+'%" title="Sem projeção oficial após 2060"></div></div>'+
    '<input type="range" id="tl" min="'+Y0+'" max="'+Y1+'" step="1" value="'+Math.round(S.year)+'" aria-label="Ano da projeção" aria-valuetext="'+Math.round(S.year)+'">'+
    '<div class="tl-ticks">'+tk.map(([y,c])=>'<span class="'+c+'" style="left:'+((y-Y0)/(Y1-Y0)*100)+'%">'+y+'</span>').join('')+'</div></div>'+
    '<div class="dnote">Hachura: sem projeção oficial após 2060</div>';
  const tl=q('tl');
  tl.oninput=()=>{stopPlay();setYear(+tl.value,true)};
  tl.onchange=announce;
  q('play').onclick=()=>S.playing?stopPlay():startPlay();
}
function syncDock(){
  const tl=q('tl'); if(!tl)return;
  const yr=Math.round(S.year);
  if(+tl.value!==yr)tl.value=yr;
  tl.setAttribute('aria-valuetext',String(yr));
  q('dYear').textContent=yr;
  q('tlFill').style.width=((S.year-Y0)/(Y1-Y0)*100)+'%';
}
function setYear(y){
  S.year=clamp(Y0,y,Y1); syncDock();
  if(S.view==='pan')updPan(); else if(S.view==='dom')updIso(); else if(S.view==='eta')updPyr();
}
let raf=0;
function startPlay(){
  if(RM){setYear(Y1);announce();return}
  if(S.year>=Y1-.01)S.year=Y0;
  S.playing=true; q('play').innerHTML=ICO.pause; q('play').setAttribute('aria-label','Pausar');
  let last=performance.now();
  const step=now=>{if(!S.playing)return;const dt=Math.min(64,now-last);last=now;
    const ny=S.year+dt/1000*9;                         /* nove anos por segundo */
    if(ny>=Y1){setYear(Y1);stopPlay();announce();return}
    setYear(ny); raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function stopPlay(){
  if(!S.playing)return; S.playing=false; cancelAnimationFrame(raf);
  const p=q('play'); if(p){p.innerHTML=ICO.play;p.setAttribute('aria-label','Reproduzir os 50 anos')}
  setYear(Math.round(S.year));
}
function announce(){
  const yr=Math.round(S.year), l=q('live');
  if(S.view==='pan')l.textContent='Ano '+yr+'. Modelo: '+n1(sv('mod',yr))+' kWh por mês por pessoa.';
  else if(S.view==='dom'){const c=houseCounts(yr);l.textContent='Ano '+yr+'. '+(c[0]+c[1])+' de cada 100 domicílios no recorte.'}
  else if(S.view==='eta')l.textContent='Ano '+yr+'. População de 60 anos ou mais: '+n1(p60(pyrAt(yr)))+'%.';
}
/* abertura: o único momento automático; o ano percorre 2026 a 2075 uma vez */
function intro(){
  if(RM||!S.intro){S.intro=false;return}
  S.intro=false; const t0=performance.now(), dur=1500;
  S.year=Y0; setYear(Y0);
  const step=now=>{if(S.playing)return;const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);
    setYear(Y0+(Y1-Y0)*e); if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ═════════ painéis laterais ═════════ */
let lastFocus=null;
function openDrawer(kind){
  lastFocus=document.activeElement;
  const yr=Math.round(S.year);
  let h='';
  if(kind==='fontes'){
    h=head(ICO.db,'Fonte dos dados')+'<div class="dr-b"><dl>'+
      [['Microdados de consumo','Pesquisa de Orçamentos Familiares'],['Período','a definir'],['Projeção populacional','IBGE, cobertura até 2060'],['Consumo residencial','a definir'],['Data de extração','a definir'],['Versão do pipeline ETL','a definir']]
      .map(([k,v])=>'<div class="kv"><dt>'+k+'</dt><dd>'+(v.indexOf('a definir')===0?'<span class="pend">'+v+'</span>':esc(v))+'</dd></div>').join('')+
      '</dl><div class="note-box">Todos os valores exibidos neste protótipo são ilustrativos e não decorrem de apuração. Registrar aqui as regras de limpeza, normalização e derivação de variáveis aplicadas aos microdados.</div></div>';
  } else if(kind==='exportar'){
    h=head(ICO.down,'Exportar dados')+'<div class="dr-b"><p class="lbl">Formato</p>'+
      '<label class="opt"><input type="radio" name="fmt" checked><span><b>CSV</b><small>Texto separado por vírgula</small></span></label>'+
      '<label class="opt"><input type="radio" name="fmt"><span><b>XLSX</b><small>Planilha</small></span></label>'+
      '<p class="lbl">Escopo</p><label class="opt"><input type="radio" name="esc" checked><span><b>Ano selecionado</b><small>'+yr+', três cenários</small></span></label>'+
      '<label class="opt"><input type="radio" name="esc"><span><b>Série completa</b><small>2026 a 2075</small></span></label>'+
      '<div class="note-box">Cada valor sai acompanhado da coluna de origem. Anos posteriores a 2060 vêm com a célula da projeção oficial vazia.</div></div>'+
      '<div class="dr-f"><button class="btn pri wide" id="doExport">'+ICO.down+'Exportar</button></div>';
  } else {
    const body={ano:yr,recorte:S.rec==='60'?'chefe_60_mais':'mononuclear_abaixo_60',unidade:'kWh/mes/pessoa',
      cenarios:SER.map(s=>({id:s.id,valor:sv(s.id,yr)==null?null:+sv(s.id,yr).toFixed(1)})),dados_ilustrativos:true};
    h=head(ICO.api,'Contrato da API')+'<div class="dr-b"><div class="warn">'+ICO.info+'<span>Contrato proposto para o requisito RF11. Ainda não implementado: a resposta abaixo é montada no navegador com os valores ilustrativos da tela.</span></div>'+
      '<div class="method"><em>GET</em><span>/projecoes?ano='+yr+'&amp;recorte='+esc(body.recorte)+'</span></div>'+
      '<pre class="code" id="apiCode">'+esc(JSON.stringify(body,null,2))+'</pre>'+
      '<div class="note-box">A documentação dos endpoints será gerada a partir do próprio código do back-end, conforme o requisito RNF09.</div></div>'+
      '<div class="dr-f"><button class="btn wide" id="doCopy">'+ICO.copy+'Copiar resposta</button></div>';
  }
  q('layer').innerHTML='<div class="scrim" data-x></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drT" tabindex="-1">'+h+'</aside>';
  const dr=q('layer').querySelector('.drawer'); dr.focus();
  q('layer').querySelectorAll('[data-x]').forEach(x=>x.onclick=closeDrawer);
  const ex=q('doExport'); if(ex)ex.onclick=()=>{closeDrawer();toast('Exportação simulada neste protótipo')};
  const cp=q('doCopy'); if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(q('apiCode').textContent).then(()=>toast('Resposta copiada'),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}};
  document.addEventListener('keydown',drKey);
}
const head=(ic,t)=>'<div class="dr-h"><h2 id="drT">'+ic+t+'</h2><button class="ib" data-x aria-label="Fechar">'+ICO.x+'</button></div>';
function drKey(e){
  if(e.key==='Escape'){closeDrawer();return}
  if(e.key==='Tab'){const d=q('layer').querySelector('.drawer');if(!d)return;
    const f=[...d.querySelectorAll('button,input,select,[tabindex="0"]')];if(!f.length)return;
    const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}
}
function closeDrawer(){q('layer').innerHTML='';document.removeEventListener('keydown',drKey);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function bindOpeners(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.open))}
let tt=0;
function toast(t){const e=q('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

/* ═════════ tema ═════════ */
function getTheme(){try{const v=localStorage.getItem('pe-theme');return v==='light'||v==='dark'?v:null}catch(e){return null}}
function effTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setThemeBtn(){const b=q('themeBtn');if(!b)return;const d=effTheme()==='dark';
  b.innerHTML=(d?ICO.sun:ICO.moon)+'<span>'+(d?'Tema claro':'Tema escuro')+'</span>';b.setAttribute('aria-label',d?'Usar tema claro':'Usar tema escuro')}
function toggleTheme(){const n=effTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=n;
  try{localStorage.setItem('pe-theme',n)}catch(e){} setThemeBtn()}

/* ═════════ roteamento ═════════ */
const VIEWS={
  pan:{t:'Panorama',ic:'pan',html:viewPan,bind:bindPan,draw:()=>drawPan(),dock:true,plots:['panPlot']},
  dom:{t:'Domicílios',ic:'dom',html:viewDom,bind:bindDom,draw:()=>drawIso(),dock:true,plots:['iso']},
  eta:{t:'Estrutura etária',ic:'eta',html:viewEta,bind:()=>{},draw:()=>{drawPyr();drawChefe()},dock:true,plots:['pyr','chefe']},
  sim:{t:'Simulador',ic:'sim',html:viewSim,bind:bindSim,draw:()=>{},dock:false}
};
function go(v){
  stopPlay(); ltClear(); S.view=v;
  const V=VIEWS[v], m=q('main');
  m.innerHTML=V.html(); m.classList.toggle('nodock',!V.dock);
  q('dock').classList.toggle('hide',!V.dock); q('dock').setAttribute('aria-hidden',String(!V.dock));
  document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.v===v)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  V.bind(); bindOpeners();
  requestAnimationFrame(()=>{if(v==='sim'){simRender(false);return} loadView(v)});
  try{history.replaceState(null,'','#'+v)}catch(e){}
}
function build(){
  q('brand').innerHTML=ICO.logo+'<b>PROCED</b><span class="bdesc">Projeção de Consumo por<br>Estrutura Demográfica</span>';
  q('tabs').innerHTML=Object.entries(VIEWS).map(([k,V])=>'<button class="tab" data-v="'+k+'">'+ICO[V.ic]+'<span>'+V.t+'</span></button>').join('');
  q('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));
  q('acts').innerHTML='<span class="illus">'+ICO.info+'Dados ilustrativos</span>'+
    '<button class="ib" data-open="fontes" aria-label="Fonte dos dados">'+ICO.db+'<span>Fontes</span></button>'+
    '<button class="ib" data-open="api" aria-label="Contrato da API">'+ICO.api+'<span>API</span></button>'+
    '<button class="ib" data-open="exportar" aria-label="Exportar dados">'+ICO.down+'<span>Exportar</span></button>'+
    '<div class="demo"><button class="ib" id="demoBtn" aria-haspopup="true" aria-expanded="false" aria-controls="demoPop">'+ICO.flask+'<span>Demonstração</span></button>'+
    '<div class="demopop" id="demoPop" hidden><p class="dp-t">Modo demonstração</p>'+
    '<button class="dp-row" role="switch" id="swFail" aria-checked="false"><span><b>Simular falha de conexão</b><small>A API deixa de responder. As telas mostram o erro e preservam os parâmetros.</small></span><i class="tog" aria-hidden="true"></i></button>'+
    '<button class="dp-row" id="replayLoad"><span><b>Rever carregamento</b><small>Mostra de novo o estado de carregamento da tela atual.</small></span></button></div></div>'+
    '<button class="ib" id="themeBtn"></button>';
  q('themeBtn').onclick=toggleTheme;
  bindDemo();
  const th=getTheme(); if(th)document.documentElement.dataset.theme=th;
  setThemeBtn();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setThemeBtn);
  buildDock();
  const h=(location.hash||'').slice(1);
  go(VIEWS[h]?h:'pan');
}
addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(VIEWS[h]&&h!==S.view)go(h)});
let rs=0;
addEventListener('resize',()=>{cancelAnimationFrame(rs);rs=requestAnimationFrame(()=>{const V=VIEWS[S.view];if(V.plots&&S.loaded[S.view]&&!S.fail)V.draw();if(S.view==='sim'&&q('billHist'))simRender(false)})});
build();
</script>
