site_name: PROCED-TCC — Projeção de Consumo por Estrutura Demográfica
site_description: Documentação técnica, arquitetural e científica do sistema PROCED (2026-2070)
site_author: Equipe PROCED-TCC
site_url: https://m4rinh0.github.io/PROCED-TCC/
repo_url: https://github.com/M4RINH0/PROCED-TCC
repo_name: M4RINH0/PROCED-TCC
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Archivo
    code: Roboto Mono
  palette:
    # Modo Claro com Esquema de Cores do PROCED
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo escuro
    # Modo Escuro com Esquema de Cores do PROCED
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Início: index.md
  - Guia do Usuário: guia-usuario.md
  - Arquitetura do Sistema:
      - Visão Geral & Diagramas: arquitetura.md
      - Decisões Técnicas: decisoes-tecnicas.md
  - Engenharia de Dados & ETL:
      - Pipeline ETL Completo: etl.md
      - Scripts de Execução: scripts.md
      - Guia dos Arquivos de Scripts: scripts/README.md
  - Banco & Dicionário de Dados:
      - Dicionário de Dados (9 Tabelas): dicionario-dados.md
      - Estrutura no Supabase: banco-supabase.md
  - Metodologia & Premissas:
      - Metodologia Científica: metodologia.md
      - Quadro de Premissas (P1 a P14): premissas.md
  - Resultados & Cenários: resultados.md
  - Contrato da API REST: contrato-api.md
  - Instalação & Desenvolvimento: desenvolvimento.md
